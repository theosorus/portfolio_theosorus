<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        @font-face {
            font-family: 'Domine';
            src: url('./fonts/domine/Domine-VariableFont_wght.ttf') format('truetype');
            font-weight: 400 700;
        }

        @font-face {
            font-family: 'JetBrains Mono';
            src: url('./fonts/jetbrains-mono/JetBrainsMono-VariableFont_wght.ttf') format('truetype');
            font-weight: 100 800;
        }

        * {
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
            background: #03224C;
            position: relative;
            overflow: hidden;
        }

        .glow {
            position: absolute;
            top: -260px;
            right: -220px;
            width: 700px;
            height: 700px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.16) 0%, rgba(167, 139, 250, 0) 70%);
        }

        .content {
            position: relative;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 90px 100px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            font-size: 18px;
            color: #B8C4DA;
            padding: 8px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.03);
            margin-bottom: 32px;
        }

        .badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #A78BFA;
        }

        .name {
            font-family: 'Domine', serif;
            font-size: 104px;
            color: #F1F3F8;
            line-height: 1.05;
            margin-bottom: 28px;
        }

        .role {
            font-size: 26px;
            color: #B8C4DA;
        }

        .role .sep {
            color: #6F82A0;
            margin: 0 14px;
        }

        .rule {
            width: 90px;
            height: 2px;
            background: #A78BFA;
            margin-top: 32px;
            margin-bottom: 32px;
        }

        .url {
            position: absolute;
            bottom: 48px;
            right: 100px;
            font-size: 18px;
            color: #6F82A0;
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="content">
        <div class="badge"><span class="dot"></span>Toulouse / Bordeaux, France</div>
        <div class="name">Théo Castillo</div>
        <div class="rule"></div>
        <div class="role">Computer Science Engineer @ ENSEEIHT<span class="sep">|</span>AI/ML Engineer @ CNES</div>
    </div>
    <div class="url">tcastillo.me</div>
</body>
</html>
